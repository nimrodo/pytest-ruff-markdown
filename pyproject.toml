[project]
name = "pytest-ruff-markdown"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nimrod Oren", email = "nimrodo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = ["ruff>=0.4.0"]

[project.entry-points.pytest11]
ruff_markdown = "pytest_ruff_markdown"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty==0.0.84",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D"]
"conftest.py" = ["D"]
