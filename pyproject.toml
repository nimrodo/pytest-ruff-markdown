[project]
name = "pytest-ruff-markdown"
version = "0.1.1"
description = "Zero-config pytest plugin that lints fenced Python code blocks in Markdown files with ruff"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Nimrod Oren", email = "nimrodo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = ["ruff>=0.4.0"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Documentation",
]

[project.entry-points.pytest11]
ruff_markdown = "pytest_ruff_markdown"

[project.scripts]
pytest-ruff-markdown-format = "pytest_ruff_markdown.format:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty==0.0.84",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D"]
"conftest.py" = ["D"]
