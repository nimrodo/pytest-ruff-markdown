name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v1.2.3"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Resolve release tag
        run: |
          TAG="${{ inputs.tag }}"
          echo "RELEASE_TAG=${TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $RELEASE_TAG is not a bare vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match pyproject.toml version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish
